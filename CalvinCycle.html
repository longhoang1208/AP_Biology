<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calvin Cycle Quest</title>
<style>
:root{
    --bg:#0b1f17;
    --pn:#143428;
    --ac:#7cfc9a;
    --tx:#e8f5ec;
    --mu:#9bb8a8;
    --zc:#2ecc71;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
}

html{
    scroll-padding-top:env(safe-area-inset-top,0px)
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(
        circle at 50% 0,
        #14402e,
        var(--bg) 70%
    );
    color:var(--tx);
    font-family:system-ui,'Segoe UI',Roboto,sans-serif;
    display:flex;
    justify-content:center
}

#app{
    width:min(94vw,460px);
    padding:14px 0 28px;text-align:center}

    header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700
}

#steps{
    display:flex;
    gap:4px;
    margin:10px 0
}

#steps span{flex:1;font-size:10px;padding:5px 2px;border-radius:6px;background:var(--pn);color:var(--mu);line-height:1.2}
#steps .on{background:var(--zc);color:#06210f;font-weight:700}
#steps .ok{background:#245c43;color:var(--tx)}
h2{margin:6px 0;font-size:19px;color:var(--zc)}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px;background:#0e2a1e;border:2px solid var(--zc);border-radius:16px}
.t{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;background:var(--pn);cursor:pointer}
.t.w{background:#06140e;cursor:default;opacity:.7}
.t.I{background:#1d4a38}.t.Q{background:#4a3d12}.t.E{background:#1e3f6b}.t.d{filter:saturate(.3) brightness(.8)}
.t.d::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px;color:var(--ac)}
.me{width:70%;aspect-ratio:1;border-radius:50%;background:var(--ac);color:#06210f;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--ac);position:absolute;animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.1)}}
#hud{margin:10px 0;color:var(--mu);font-size:14px}
#dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center}
#dp button{height:48px;font-size:20px}
button{font:inherit;border:0;border-radius:10px;background:var(--pn);color:var(--tx);cursor:pointer;padding:10px 14px}
.btn{background:var(--ac);color:#06210f;font-weight:700;margin-top:12px;padding:12px 22px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov[hidden]{display:none}
.box{background:#102c20;border:2px solid var(--zc);border-radius:18px;padding:20px;width:min(100%,440px);max-height:90vh;overflow:auto;text-align:left}
.box h3{margin:0 0 8px;color:var(--ac)}
.opt{display:block;width:100%;margin:7px 0;text-align:left;border:2px solid #2c5a45}
.opt.ok{background:#1f7a46;border-color:var(--ac)}.opt.bad{background:#7a2a2a;border-color:#e55}
.opt:disabled{cursor:default}
.c{text-align:center}.c .btn{display:inline-block}
.big{font-size:44px}

.no{position:absolute;top:3px;left:5px;z-index:2;font-size:11px;font-weight:800;color:var(--ac);background:#000a;border-radius:6px;padding:0 5px}
.t.nx{outline:2px dashed var(--zc);outline-offset:-2px}
</style>
</head>
<body>
<div id="app">
    <header>
        <span>🌿 Calvin Cycle Quest</span><span id="sc">⭐ 0</span>
    </header>
    <div id="steps"></div>
    <h2 id="zt"></h2>
    <div id="board"></div>
    <div id="hud"></div>
    <div id="dp">
        <span></span>
        <button data-d="0,-1">▲</button>
        <span></span>
        <button data-d="-1,0">◀</button>
        <button data-d="0,1">▼</button>
        <button data-d="1,0">▶</button>
    </div>
    
    <p style="color:var(--mu);font-size:12px">Move with arrow keys / WASD, the buttons, or tap a neighbouring tile.<br>💡 theory · ❓ quiz · 🚪 exit (unlocks when all 💡 and ❓ are done)</p>
</div>

<div class="ov" id="ov"><div class="box c" id="mb"></div></div>

<script>
// One layout per section (S=start, I=theory, Q=quiz, E=exit, #=wall).
// Each path runs: theory tiles first, then quiz tiles, then the exit - no backtracking.
const LAYOUTS=[
    ["SIII#","###I#","#EQQ#"],
    ["SII##","##I#E","##IQQ"],
    ["S##E#","I#QQ#","III##"],
    ["IIS##","I####","IQQE#"],
    ["SIIII","####Q","###EQ"]
];
const Z=[
    {
        n:"1 · Enter the chloroplast",
        i:[
            "Welcome, CO₂! You are a carbon dioxide molecule that just entered a leaf through a stoma. Next stop: the chloroplast.",
            "A chloroplast has two membranes. Inside are stacks of thylakoids (grana) floating in a fluid called the stroma.",
            "The light reactions happen in the thylakoid membranes. They produce ATP and NADPH.",
            "The Calvin cycle happens in the stroma. It uses ATP and NADPH to build sugar from CO₂."
        ],
        q:[
            [
                "Where in the chloroplast does the Calvin cycle take place?",
                [
                    "Thylakoid membrane",
                    "Stroma",
                    "Outer membrane",
                    "Intermembrane space"
                ],
                1,
                "The enzymes of the Calvin cycle are dissolved in the stroma."
            ],
            [
                "Which molecules do the light reactions supply to the Calvin cycle?",["ATP and NADPH","O₂ and glucose","CO₂ and H₂O","ADP and NADP⁺"],0,"ATP provides energy and NADPH provides high-energy electrons."
            ]
        ]
    },
    {
        n:"2 · Carbon fixation",
        i:[
            "Stage 1: Carbon fixation. CO₂ is attached to an organic molecule so its carbon can become part of a sugar.",
            "The CO₂ acceptor is RuBP (ribulose-1,5-bisphosphate), a 5-carbon sugar.",
            "The enzyme Rubisco catalyzes this reaction. It is probably the most abundant enzyme on Earth.",
            "The 6-carbon product is unstable and splits at once into two molecules of 3-PGA (3-phosphoglycerate), 3 carbons each."
        ],
        q:[
            [
                "What is the CO₂ acceptor in the Calvin cycle?",
                [
                    "RuBP",
                    "G3P",
                    "3-PGA",
                    "NADPH"
                ],
                0,
                "RuBP (5 carbons) combines with CO₂."
            ],
            [
                "Which enzyme fixes CO₂ onto RuBP?",
                [
                    "ATP synthase",
                    "Rubisco",
                    "Catalase",
                    "Amylase"
                ],
                1,
                "Rubisco = RuBP carboxylase/oxygenase."
            ]
        ]
    },
    {
        n:"3 · Reduction",
        i:[
            "Stage 2: Reduction. Each 3-PGA receives a phosphate from ATP, forming 1,3-bisphosphoglycerate.",
            "NADPH then donates electrons, reducing it to G3P (glyceraldehyde-3-phosphate), a 3-carbon sugar. NADPH becomes NADP⁺.",
            "For every 3 CO₂ fixed, 6 G3P are made, using 6 ATP and 6 NADPH.",
            "Only 1 of those 6 G3P is the net gain. It leaves the cycle to make glucose and other carbohydrates; the other 5 stay in the cycle."
        ],
        q:[
            [
                "What is the role of NADPH in the reduction stage?",["It donates electrons","It fixes CO₂","It splits water","It makes ATP"],0,"Reduction means gaining electrons, and NADPH is the electron donor."
            ],
            [
                "From 3 CO₂, 6 G3P are made. How many leave the cycle as net product?",["6","3","1","5"],2,"Only 1 G3P exits; the other 5 are recycled into RuBP."
            ]
        ]
    },
    {
        n:"4 · Regeneration",
        i:[
            "Stage 3: Regeneration. The cycle must rebuild RuBP, or it cannot fix any more CO₂.",
            "Five G3P (5 × 3 = 15 carbons) are rearranged into three RuBP (3 × 5 = 15 carbons).",
            "This rearrangement uses 3 ATP. NADPH is not needed in this stage.",
            "RuBP is back! The cycle is ready to accept new CO₂ molecules."
        ],
        q:[
            [
                "What is regenerated in the last stage of the cycle?",["RuBP","CO₂","NADPH","Glucose"],0,"Regenerating RuBP keeps the cycle going."
            ],
            [
                "How many ATP are used to regenerate 3 RuBP?",["1","3","6","9"],1,"Regeneration uses 3 ATP (per 3 CO₂ fixed)."
            ]
        ]
    },
    {
        n:"5 · Final destination",
        i:[
            "Final destination! One turn of the cycle fixes just 1 CO₂, so three turns (3 CO₂) are needed for 1 net G3P.",
            "Total for 3 CO₂: 9 ATP and 6 NADPH → 1 net G3P.",
            "Two G3P can combine into one glucose (C₆H₁₂O₆), so 6 CO₂ are fixed per glucose.",
            "G3P is also used to build sucrose, starch, cellulose, fats and amino acids. Plants feed the whole food chain!"
        ],
        q:[
            [
                "How much ATP and NADPH are needed to make 1 net G3P?",["3 ATP, 3 NADPH","9 ATP, 6 NADPH","6 ATP, 9 NADPH","18 ATP, 12 NADPH"],1,"3 CO₂ → 9 ATP + 6 NADPH → 1 G3P."
            ],
            [
                "How many CO₂ must be fixed to build one glucose?",["3","6","9","12"],1,"1 glucose = 2 G3P = 6 CO₂ fixed."
            ]
        ]
    }
];

const $=i=>document.getElementById(i);
let z,x,y,T,done,score,tries;

function open(h){
    $('mb').innerHTML=h;
    $('ov').hidden=false;
    const b=$('mb').querySelector('.btn');
    if(b)b.focus();
}

function shut(){
    $('ov').hidden=true;
    draw()
}

function load(){
    const g=LAYOUTS[z];
    let sx=0,sy=0;
    g.forEach((r,j)=>[...r].forEach((c,i)=>{if(c=='S'){sx=i;sy=j}}));
    // BFS from the start: distance along the path decides the numbering
    const D={},q=[[sx,sy]];
    D[sx+','+sy]=0;
    while(q.length){
        const[cx,cy]=q.shift();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
            const nx=cx+dx,ny=cy+dy;
            if(g[ny]&&g[ny][nx]&&g[ny][nx]!='#'&&D[nx+','+ny]===undefined){
                D[nx+','+ny]=D[cx+','+cy]+1;
                q.push([nx,ny])
            }
        })
    }
    done=new Set();
    x=sx;
    y=sy;
    T=g.map((r,j)=>[...r].map((c,i)=>({c,i,j,d:D[i+','+j]})));
    const f=ch=>T.flat().filter(t=>t.c==ch).sort((a,b)=>a.d-b.d);
    const I=f('I'),Q=f('Q');
    I.forEach((t,k)=>{t.k=k;t.n=k+1});             // theory: 1..4
    Q.forEach((t,k)=>{t.k=k;t.n=I.length+k+1});    // quiz: 5..6
    draw();
}

function cnt(){
    const f=ch=>T.flat().filter(t=>t.c==ch);
    return[f('I').filter(t=>done.has(t.i+','+t.j)).length,f('I').length,f('Q').filter(t=>done.has(t.i+','+t.j)).length,f('Q').length]
}

function draw(){
    const[a,b,c,d]=cnt(), all = a == b && c == d;
    const nxt=Math.min(...T.flat().filter(t=>t.n&&!done.has(t.i+','+t.j)).map(t=>t.n));
    $('zt').textContent=Z[z].n;$('sc').textContent='⭐ '+score;
    document.documentElement.style.setProperty(
        '--zc',
        [
            '#2ecc71',
            '#f1c40f',
            '#e67e22',
            '#9b59b6',
            '#3498db'
        ][z]
    );
    $('steps').innerHTML=Z.map((q,i)=>`<span class="${i==z?'on':i<z?'ok':''}">${q.n.slice(4)}</span>`).join('');
    $('hud').textContent=`💡 ${a}/${b}   ❓ ${c}/${d}`+(all?'   🚪 Exit unlocked!':'   ➜ Next: #'+nxt);
    $('board').innerHTML=T.flat().map(
        t=>{
            const dn=done.has(t.i+','+t.j);
            const ic={I:'💡',Q:'❓',E:all?'🚪':'🔒',S:'🌱'}[t.c]||'';
            return`<div class="t ${t.c=='#'?'w':t.c} ${dn?'d':''} ${t.n===nxt?'nx':''}" data-i="${t.i}" data-j="${t.j}">${t.n?'<b class="no">'+t.n+'</b>':''}${x==t.i&&y==t.j?'<div class="me">CO₂</div>':ic}</div>`
        }
    ).join('')
}

function mv(dx,dy){
    if(!$('ov').hidden)return;
    const nx=x+dx,ny=y+dy;
    if(!T[ny]||!T[ny][nx]||T[ny][nx].c=='#')return;
    x=nx;
    y=ny;
    draw();
    step(T[y][x])
}

function step(t){
    const k=t.i+','+t.j,d=Z[z];
    if((t.c=='I'||t.c=='Q')&&!done.has(k)){
        const p=T.flat().find(u=>u.n&&u.n<t.n&&!done.has(u.i+','+u.j));
        if(p){
            open(`<h3>🔢 Follow the order</h3><p>Finish tile <b>${p.n}</b> first. Theory 💡 always comes before quizzes ❓.</p><button class="btn" onclick="shut()">OK</button>`);
            return
        }
    }
    if(t.c=='I'&&!done.has(k)){
        done.add(k);
        draw();
        open(`<h3>💡 Theory</h3><p>${d.i[t.k]}</p><button class="btn" onclick="shut()">Got it!</button>`)
    }else if(t.c=='Q'&&!done.has(k)){
        ask(t,k);
    }else if(t.c=='E'){
        const[a,b,c,e]=cnt();
        if(a<b||c<e){
            open(`<h3>🔒 Door locked</h3><p>Collect every 💡 and answer every ❓ in this section first.</p><button class="btn" onclick="shut()">OK</button>`);
        }else if(z==4){
            end();
        }else{
            open(`<div class="big">🎉</div><h3>Section complete!</h3><p>Next: <b>${Z[z+1].n.slice(4)}</b></p><button class="btn" onclick="z++;shut();load()">Continue ➜</button>`)
        }
    }
}

function ask(t,k){
    const q=Z[z].q[t.k];
    tries=0;open(`<h3>❓ Quiz</h3><p>${q[0]}</p><div id="o"></div><p id="fb"></p>`);
    q[1].forEach((o,n)=>{
        const b=document.createElement('button');
        b.className='opt';
        b.textContent=o;b.onclick=()=>{
            if(n==q[2]){
                b.classList.add('ok');
                done.add(k);
                score+=tries?5:10;
                $('sc').textContent='⭐ '+score;
                $('o').querySelectorAll('button').forEach(s=>s.disabled=true);
                $('fb').innerHTML=`✅ <b>Correct!</b> ${q[3]}<br><button class="btn" onclick="shut()">Continue</button>`;
                $('fb').querySelector('.btn').focus()
            }else{
                tries++;
                b.classList.add('bad');
                b.disabled=true;
                $('fb').textContent='❌ Not quite, try another answer.'
            }
        };
        $('o').appendChild(b)
    })
}

function review(t){
    const d=Z[z];
    if(t.c=='I'){
        open(`<h3>💡 Theory #${t.n}</h3><p>${d.i[t.k]}</p><button class="btn" onclick="shut()">Close</button>`);
    }else{
        const q=d.q[t.k];
        open(`<h3>❓ Quiz #${t.n} (review)</h3><p>${q[0]}</p>${q[1].map((o,n)=>`<button class="opt ${n==q[2]?'ok':''}" disabled>${o}</button>`).join('')}<p>✅ ${q[3]}</p><button class="btn" onclick="shut()">Close</button>`);
    }
}

function end(){
    const r=score>=90?'🏆 Calvin Cycle Master':score>=60?'🥈 Great Biologist':'🥉 Keep Practicing';
    open(`<div class="big">🍬</div><h3>You became sugar!</h3><p>Three CO₂ + 9 ATP + 6 NADPH → <b>1 G3P</b>, ready to build glucose.</p><p>Score: <b>${score}/100</b><br>${r}</p><button class="btn" onclick="begin()">Play again</button>`)
}

function begin(){
    z=0;
    score=0;
    load();
    $('ov').hidden=true;
    draw()
}

document.addEventListener('keydown',e=>{
    const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
    if(m){
        e.preventDefault();mv(...m)
    }
});

document.querySelectorAll('#dp button').forEach(b=>b.onclick=()=>mv(...b.dataset.d.split(',').map(Number)));
$('board').onclick=e=>{
    const t=e.target.closest('.t');
    if(!t)return;
    // Clicking a finished theory/quiz tile reopens it for review
    const tl=T[+t.dataset.j][+t.dataset.i];
    if($('ov').hidden&&(tl.c=='I'||tl.c=='Q')&&done.has(tl.i+','+tl.j)){review(tl);return}
    const dx=+t.dataset.i-x,dy=+t.dataset.j-y;
    if(Math.abs(dx)+Math.abs(dy)==1)mv(dx,dy);
    else if(!dx&&!dy)step(T[y][x])
};
z=0;score=0;
load();
open(`<div class="big">🌿</div><h3>Calvin Cycle Quest</h3><p>You are a CO₂ molecule. Travel through the chloroplast, collect theory 💡, answer quizzes ❓ and turn into sugar! 5 sections, 10 questions.</p><button class="btn" onclick="shut()">▶ Start</button>`);
</script>
</body>
</html>
